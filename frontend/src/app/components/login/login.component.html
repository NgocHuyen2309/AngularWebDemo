<div class="login-container fade-in-up">
  <div class="login-card shadow-lg">
    <div class="login-card__header">
      <h3 class="fw-bold mb-1"><span class="starry-gradient-text">Welcome to Crown & Velvet</span></h3>
      <p class="mb-0">Secure Enterprise Account & Catalog Management</p>
    </div>

    <div class="login-card__tabs d-flex gap-2 p-1.5 mb-3">
      <p-button
        styleClass="login-card__tab-btn flex-fill py-2 rounded-2 fw-semibold"
        [severity]="activeTab === 'login' ? 'primary' : 'secondary'"
        [text]="activeTab !== 'login'"
        (onClick)="switchTab('login')"
        label="Sign In"
        >
      </p-button>
      <p-button
        styleClass="login-card__tab-btn flex-fill py-2 rounded-2 fw-semibold"
        [severity]="activeTab === 'register' ? 'primary' : 'secondary'"
        [text]="activeTab !== 'register'"
        (onClick)="switchTab('register')"
        label="Register"
        >
      </p-button>
    </div>

    <div class="login-card__body">
      <!-- Sign In Tab -->
      @if (activeTab === 'login') {
        <div>
          @if (errorMessage) {
            <div class="login-card__error alert alert-danger d-flex align-items-center gap-2 mb-3 py-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
              </svg>
              <div class="small">{{ errorMessage }}</div>
            </div>
          }
          <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
            <formly-form
              [form]="loginForm"
              [fields]="loginFields"
              [model]="loginModel"
            ></formly-form>

            <!-- Compact, clean button layout right aligned or center fit -->
            <div class="d-flex justify-content-end mt-4">
              <p-button
                type="submit"
                [loading]="loading"
                styleClass="login-card__submit-btn fw-bold px-5 py-2.5"
                label="SIGN IN"
                >
              </p-button>
            </div>
          </form>
        </div>
      }

      <!-- Register Tab -->
      @if (activeTab === 'register') {
        <div>
          <app-user-form></app-user-form>
        </div>
      }
    </div>
  </div>
</div>
